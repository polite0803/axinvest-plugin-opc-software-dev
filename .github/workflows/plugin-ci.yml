name: Plugin CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: short
  PLUGIN_NAME: opc-software-dev

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - name: Install bundle-only Node dependencies
        if: hashFiles('package.json') != ''
        run: npm install --no-audit --no-fund
      - name: Check independent repository boundaries
        run: node scripts/check-release-dependencies.mjs
      - name: Check Rust formatting
        run: if [ -f Cargo.toml ]; then cargo fmt --all --check; fi
      - name: Check Rust sources
        run: if [ -f Cargo.toml ]; then cargo check --workspace --all-targets; fi
      - name: Test Rust sources
        run: if [ -f Cargo.toml ]; then cargo test --workspace --all-targets; fi
      - name: Lint Rust sources
        run: if [ -f Cargo.toml ]; then cargo clippy --workspace --all-targets -- -D warnings; fi
      - name: Build and verify plugin bundle
        run: node scripts/build-plugin-bundle.mjs --plugin "${PLUGIN_NAME}" --check --out "dist/plugins/${PLUGIN_NAME}"
